services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_PORT=11434
    command: ["serve"]

  model-puller:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    command: ["pull", "gemma3:1b"]
    restart: "no"

volumes:
  ollama_data: